name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.x" }
      - run: bun install --cwd server --frozen-lockfile && bun install --cwd web --frozen-lockfile
      - run: bun run --cwd server typecheck
      - run: bun test --cwd server && bun test --cwd web src/lib
      - run: bun run --cwd web build

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps hand-off: production is the ArgoCD app `car-info`, which syncs krymancer/homelab-infra
  # k8s/apps/car-info. Pinning the new digest there deploys every push to main.
  # HOMELAB_INFRA_DEPLOY_KEY is an SSH deploy key with write access to homelab-infra.
  promote:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: krymancer/homelab-infra
          ref: main
          ssh-key: ${{ secrets.HOMELAB_INFRA_DEPLOY_KEY }}
      - name: Pin image digest in homelab-infra
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          test -n "$DIGEST"
          FILE=k8s/apps/car-info/workloads.yaml
          sed -i -E "s#ghcr.io/krymancer/car-info@sha256:[0-9a-f]+#ghcr.io/krymancer/car-info@${DIGEST}#" "$FILE"
          grep -q "ghcr.io/krymancer/car-info@${DIGEST}" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Deploy Car Info ${GITHUB_SHA::7}" -m "$MESSAGE" || { echo "already deployed"; exit 0; }
          git push

  apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu-latest ships the Android SDK and sets ANDROID_HOME.
      - run: bun install --cwd web --frozen-lockfile
      # Secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD keep the signature stable across builds.
      - name: Restore keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        if: env.KS != ''
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CARINFO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./scripts/build-apk.sh
        env:
          CARINFO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.{0}', github.run_number) }}
      - uses: actions/upload-artifact@v4
        with: { name: car-info-apk, path: out/*.apk }
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        # Only signed builds; unsigned APKs (no keystore secrets) can't be installed anyway.
        with: { files: out/car-info.apk, fail_on_unmatched_files: false }
