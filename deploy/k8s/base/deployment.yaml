apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-info
spec:
  replicas: 1 # SQLite: exactly one writer
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: car-info }
  template:
    metadata:
      labels: { app: car-info }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: car-info
          image: ghcr.io/krymancer/car-info:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: PORT, value: "8080" }
            - { name: DATA_DIR, value: /data }
            - { name: BACKUP_DIR, value: /backups }
            - { name: BACKUP_KEEP, value: "30" }
            - name: APP_PASSWORD
              valueFrom: { secretKeyRef: { name: car-info-secrets, key: APP_PASSWORD, optional: true } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: backups, mountPath: /backups }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: car-info-data }
        # PVC comes from the overlay (overlays/homelab/backups-nfs.yaml points it at the NAS).
        - name: backups
          persistentVolumeClaim: { claimName: car-info-backups }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: car-info-data
spec:
  # Keep the live SQLite file on node-local storage; network filesystems break its locking.
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
