apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-info
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: car-info-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cars.homelab.krymancer.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: car-info, port: { name: http } } }
  tls:
    - hosts: [cars.homelab.krymancer.dev]
      # Wildcard cert mirrored into the namespace by Reflector.
      secretName: homelab-wildcard-tls
---
# LAN and Tailscale only; the app password is a second layer, not the only one.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
spec:
  ipAllowList:
    sourceRange: [192.168.0.0/24, 100.64.0.0/10, 10.42.0.0/24]
